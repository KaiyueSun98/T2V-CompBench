[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llava"
version = "1.2.2.post1"
description = "Towards GPT-4 like large language and visual assistant."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "transformers==4.37.2", "tokenizers==0.15.1", "sentencepiece==0.1.99", "shortuuid",
    "accelerate==0.21.0", "peft", "bitsandbytes",
    "pydantic", "markdown2[all]", "scikit-learn==1.2.2",
    "gradio==4.16.0", "gradio_client==0.8.1",
    "requests", "httpx==0.24.0", "uvicorn", "fastapi",
    "einops==0.6.1", "einops-exts==0.0.4", "timm==0.6.13",
    "av==12.1.0", "cmake==3.29.2", "ftfy==6.3.0", "huggingface-hub==0.25.2",
    "imageio==2.34.1", "matplotlib==3.8.4", "moviepy==1.0.3", 
    "mpmath==1.3.0", "multiprocess==0.70.16", "numpy==1.26.4",
    "opencv-python==4.10.0.82", "pandas==2.2.2", "scipy==1.13.0",
    "sglang==0.1.14", "tomlkit==0.12.0", "torch==2.3.0", "tqdm==4.66.4", "triton==2.3.0", "typer==0.12.3",
    "xformers==0.0.26.post1", "torchvision==0.18.0",
]

[project.optional-dependencies]
train = ["deepspeed==0.12.6", "ninja", "wandb"]
build = ["build", "twine"]

[project.urls]
"Homepage" = "https://llava-vl.github.io"
"Bug Tracker" = "https://github.com/haotian-liu/LLaVA/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]
